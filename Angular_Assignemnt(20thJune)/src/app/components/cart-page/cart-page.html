<div class="cart-page">
  <h2>Your Cart</h2>
  <ng-container *ngIf="(cartItems$ | async) as cartItems">
    <div *ngIf="cartItems.length > 0; else emptyCart" class="cart-list">
      <div *ngFor="let item of cartItems" class="cart-book-card">
        <img [src]="item.product.image" [alt]="item.product.title" class="cart-book-image" />
        <div class="cart-book-details">
          <div class="cart-book-title">{{ item.product.title }}</div>
          <div class="cart-book-price">₹{{ item.product.price }}</div>
          <div class="cart-book-qty">Quantity: {{ item.quantity }}</div>
          <button class="remove-btn" (click)="removeFromCart(item.product.id)">Remove from cart</button>
        </div>
      </div>
    </div>
    <ng-template #emptyCart>
      <p>Your cart is empty.</p>
    </ng-template>
  </ng-container>
</div>
